name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB PAGES MUST BE SET TO "GitHub Actions" AS ITS SOURCE, once, by hand:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# Without that this workflow builds green and deploys nothing.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24        # 22+ needed: the i18n check imports .ts directly
          cache: npm
      - run: npm ci
      # Build first. Four of the assertions read dist/ — anchor integrity,
      # the no-third-party-scripts claim the footer makes to visitors, the
      # JSON-LD placeholder gate, and the hreflang pair. dist/ is gitignored,
      # so without this step they fail on a checkout with nothing to inspect.
      - run: npm run build
      # The assertions that used to live in comments: contrast ratios computed
      # from the design tokens, locale key parity, French spacing, anchor
      # integrity, and that no third-party script ships (the footer says so).
      - run: npm test

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Defaults in astro.config.mjs already target the Pages URL, so no env is
      # needed here. Building for the real domain instead:
      #   SITE_URL=https://lambdasoft.com BASE_PATH=/ npm run build
      - uses: withastro/action@v3
        with:
          node-version: 24

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
